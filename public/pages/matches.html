<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentClash</title>
  <link rel="stylesheet" href="/assets/shared.css?v=1">
  <script src="/assets/i18n.js?v=1"></script>
  <script src="/assets/api.js?v=1"></script>
  <script src="/assets/nav.js?v=1"></script>
  <style>
    .matches-wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px; }
    .matches-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
    .matches-head h1 { font-size: 22px; color: var(--text); margin: 0; }

    .filter-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 8px; padding: 4px; border: 1px solid var(--border); }
    .filter-tab { padding: 6px 14px; font-size: 13px; color: var(--text-dim); background: transparent; border: none; border-radius: 6px; cursor: pointer; }
    .filter-tab.active { background: var(--gold); color: var(--bg); font-weight: 600; }
    .filter-tab:hover:not(.active) { color: var(--text); }

    .matches-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .matches-table th { text-align: left; padding: 10px 14px; font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    .matches-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--text); }
    .matches-table tr:last-child td { border-bottom: none; }
    .matches-table tr:hover { background: rgba(255,255,255,0.02); }

    .vs-cell { color: var(--text-dim); margin: 0 6px; font-size: 11px; }
    .name-a { color: var(--blue-light); }
    .name-b { color: var(--red-light); }
    .score-num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .result-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; min-width: 56px; text-align: center; }
    .result-badge.win { background: rgba(100,170,255,0.15); color: var(--blue-light); }
    .result-badge.loss { background: rgba(255,100,100,0.15); color: var(--red-light); }
    .result-badge.draw { background: rgba(180,180,180,0.15); color: var(--text-dim); }
    .type-chip { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); margin-left: 6px; vertical-align: middle; }
    .type-chip.challenge { color: var(--gold); border-color: var(--gold); }
    .first-chip { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 10px; font-weight: 700; background: rgba(218,165,32,0.16); color: var(--gold); margin: 0 4px; vertical-align: middle; white-space: nowrap; }

    .cmd-head-back { display: inline-block; margin-bottom: 4px; color: var(--text-dim); text-decoration: none; font-size: 12px; }
    .cmd-head-back:hover { color: var(--gold); }
    .opp-name { color: var(--text); }
    .time-cell { color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .replay-link { color: var(--gold); text-decoration: none; font-size: 12px; }
    .replay-link:hover { text-decoration: underline; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .signin-prompt { text-align: center; padding: 40px 20px; }
    .signin-prompt a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .signin-prompt a:hover { text-decoration: underline; }

    .load-more-row { text-align: center; margin-top: 16px; }
    .load-more-btn { padding: 8px 20px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 13px; }
    .load-more-btn:hover { border-color: var(--gold); color: var(--gold); }
    .load-more-btn:disabled { color: var(--text-dim); cursor: not-allowed; }

    .loading-row { text-align: center; padding: 40px 0; color: var(--text-dim); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .matches-table th:nth-child(1), .matches-table td:nth-child(1) { display: none; }
      .matches-table th, .matches-table td { padding: 10px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <main class="matches-wrap">
    <div class="matches-head">
      <h1 data-i18n="matches.title">对战记录</h1>
      <div class="filter-tabs">
        <button class="filter-tab" data-filter="all" data-i18n="matches.filter.all">全部</button>
        <button class="filter-tab" data-filter="mine" data-i18n="matches.filter.mine">我的</button>
      </div>
    </div>

    <div id="content">
      <div class="loading-row"><span class="spinner"></span></div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script>
    (async function () {
      await window.i18nReady;

      const PAGE_SIZE = 50;
      const lang = (window.i18n && window.i18n.lang) || "zh";
      const content = document.getElementById("content");
      let currentFilter = "all";
      let offset = 0;
      let rows = [];
      let exhausted = false;
      let signedIn = false;

      // Commander mode: /matches?commander=<id>&name=<displayName> shows just that
      // commander's battle history (linked from the leaderboard).
      const params = new URLSearchParams(location.search);
      const commanderId = params.get("commander");
      const commanderName = params.get("name") || "";
      const commanderMode = !!commanderId;

      if (commanderMode) {
        // No "all / mine" filtering in commander mode — replace the head.
        const head = document.querySelector(".matches-head");
        if (head) {
          head.innerHTML = `
            <div>
              <a class="cmd-head-back" href="/${lang}/leaderboard">${t("matches.back_to_leaderboard")}</a>
              <h1>${t("matches.commander_records", { name: escapeHtml(commanderName) || commanderId })}</h1>
            </div>`;
        }
      } else {
        try {
          const who = await api.get("/api/me/whoami");
          signedIn = !!who.signedIn;
        } catch { /* keep signedIn=false */ }

        if (signedIn) {
          currentFilter = "mine";
          document.querySelector('.filter-tab[data-filter="all"]')?.classList.remove("active");
          document.querySelector('.filter-tab[data-filter="mine"]')?.classList.add("active");
        }
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      // ⚡ chip marking the coin-flip winner who moved first. `side` is "A"/"B".
      function firstMoverChip(firstSide, side) {
        if (firstSide !== side) return "";
        return `<span class="first-chip" title="${t("matches.first_mover_hint")}">${t("matches.first_mover")}</span>`;
      }

      function fmtTime(iso) {
        try {
          const d = new Date(iso);
          const today = new Date();
          const sameDay = d.toDateString() === today.toDateString();
          return sameDay
            ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
            : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        } catch { return iso; }
      }

      function renderRow(m) {
        const a = m.participantA.displayName || m.participantA.submittedBy || "—";
        const b = m.participantB.displayName || m.participantB.submittedBy || "—";
        const aLeft = m.summary?.myUnitsRemaining ?? "—";
        const bLeft = m.summary?.enemyUnitsRemaining ?? "—";
        const cls = m.resultA === "win" ? "win" : m.resultA === "loss" ? "loss" : "draw";
        const label = t(`matches.result.${cls}`);
        const typeChip = m.type === "challenge"
          ? `<span class="type-chip challenge">${t("matches.type.challenge")}</span>`
          : `<span class="type-chip">${t("matches.type.simulate")}</span>`;
        return `
          <tr>
            <td class="time-cell">${escapeHtml(fmtTime(m.createdAt))}</td>
            <td>
              <span class="name-a">${firstMoverChip(m.firstSide, "A")}${escapeHtml(a)} <span class="score-num">(${aLeft})</span></span>
              <span class="vs-cell">VS</span>
              <span class="name-b"><span class="score-num">(${bLeft})</span> ${escapeHtml(b)}${firstMoverChip(m.firstSide, "B")}</span>
              ${typeChip}
            </td>
            <td><span class="result-badge ${cls}">${label}</span></td>
            <td><a class="replay-link" href="/${lang}/replay/${m.matchId}">${t("matches.view_replay")}</a></td>
          </tr>`;
      }

      // Row renderer for commander mode (/api/commanders/:id/matches shape).
      function renderCommanderRow(m) {
        const opp = m.opponentName || m.opponent || "—";
        const myLeft = m.summary?.myUnitsRemaining ?? "—";
        const oppLeft = m.summary?.enemyUnitsRemaining ?? "—";
        const cls = m.result === "win" ? "win" : m.result === "loss" ? "loss" : "draw";
        const label = t(`matches.result.${cls}`);
        const typeChip = m.type === "challenge"
          ? `<span class="type-chip challenge">${t("matches.type.challenge")}</span>`
          : `<span class="type-chip">${t("matches.type.simulate")}</span>`;
        const firstChip = m.iMovedFirst === true
          ? `<span class="first-chip" title="${t("matches.first_mover_hint")}">${t("matches.first_mover")}</span>`
          : "";
        return `
          <tr>
            <td class="time-cell">${escapeHtml(fmtTime(m.createdAt))}</td>
            <td>
              <span class="name-a">${firstChip}${escapeHtml(commanderName || t("matches.this_commander"))} <span class="score-num">(${myLeft})</span></span>
              <span class="vs-cell">VS</span>
              <span class="opp-name"><span class="score-num">(${oppLeft})</span> ${escapeHtml(opp)}</span>
              ${typeChip}
            </td>
            <td><span class="result-badge ${cls}">${label}</span></td>
            <td><a class="replay-link" href="/${lang}/replay/${m.matchId}">${t("matches.view_replay")}</a></td>
          </tr>`;
      }

      function renderTable() {
        if (!commanderMode && currentFilter === "mine" && !signedIn) {
          content.innerHTML = `
            <div class="signin-prompt">
              <p>${t("matches.filter.mine_signin_hint")}</p>
              <p style="margin-top:12px"><a href="/auth/github">${t("nav.login")}</a></p>
            </div>`;
          return;
        }
        if (rows.length === 0) {
          content.innerHTML = `<div class="empty-state">${t("common.empty")}</div>`;
          return;
        }
        const tableHtml = `
          <table class="matches-table">
            <thead>
              <tr>
                <th>${t("matches.col.time")}</th>
                <th>${t("matches.col.players")}</th>
                <th>${t("matches.col.result")}</th>
                <th>${t("matches.col.action")}</th>
              </tr>
            </thead>
            <tbody>${rowsHtml(rows)}</tbody>
          </table>
          <div class="load-more-row">
            <button class="load-more-btn" id="loadMoreBtn" ${exhausted ? "disabled" : ""}>
              ${exhausted ? t("matches.no_more") : t("matches.load_more")}
            </button>
          </div>`;
        content.innerHTML = tableHtml;
        bindLoadMore();
      }

      function rowsHtml(batch) {
        const rowRenderer = commanderMode ? renderCommanderRow : renderRow;
        return batch.map(rowRenderer).join("");
      }

      function bindLoadMore() {
        const btn = document.getElementById("loadMoreBtn");
        if (btn && !exhausted) btn.addEventListener("click", () => loadPage(false));
      }

      // Toggle just the button's loading state — leaves the table (and the
      // user's scroll position) untouched while "load more" is in flight.
      function setLoadMoreLoading(loading) {
        const btn = document.getElementById("loadMoreBtn");
        if (!btn) return;
        if (loading) {
          btn.disabled = true;
          btn.textContent = t("common.loading");
        } else {
          btn.disabled = exhausted;
          btn.textContent = exhausted ? t("matches.no_more") : t("matches.load_more");
        }
      }

      async function loadPage(reset) {
        if (reset) { rows = []; offset = 0; exhausted = false; }
        if (!commanderMode && currentFilter === "mine" && !signedIn) { renderTable(); return; }
        // Initial load / filter switch shows the full spinner. "Load more"
        // keeps the existing rows in place and only marks the button busy, so
        // the page no longer flashes/scrolls back to the top.
        if (reset) {
          content.innerHTML = `<div class="loading-row"><span class="spinner"></span></div>`;
        } else {
          setLoadMoreLoading(true);
        }
        const url = commanderMode
          ? `/api/commanders/${encodeURIComponent(commanderId)}/matches?limit=${PAGE_SIZE}&offset=${offset}`
          : currentFilter === "mine"
            ? `/api/me/matches?limit=${PAGE_SIZE}&offset=${offset}`
            : `/api/matches?limit=${PAGE_SIZE}&offset=${offset}`;
        try {
          const data = await api.get(url);
          // Commander endpoint returns a bare array; the others return { matches }.
          const batch = Array.isArray(data) ? data : (data.matches || []);
          if (batch.length < PAGE_SIZE) exhausted = true;
          const tbody = reset ? null : content.querySelector(".matches-table tbody");
          if (!reset && tbody) {
            // Append new rows in place — no full re-render, scroll preserved.
            tbody.insertAdjacentHTML("beforeend", rowsHtml(batch));
            rows = rows.concat(batch);
            offset += batch.length;
            setLoadMoreLoading(false);
          } else {
            rows = rows.concat(batch);
            offset += batch.length;
            renderTable();
          }
        } catch (err) {
          if (reset) {
            content.innerHTML = `<div class="empty-state" style="color:#f66">${t("common.error")}: ${escapeHtml(err.message)}</div>`;
          } else {
            // Keep the loaded rows; just restore the button so the user can retry.
            setLoadMoreLoading(false);
          }
        }
      }

      document.querySelectorAll(".filter-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-tab").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          loadPage(true);
        });
      });

      loadPage(true);
    })();
  </script>
</body>
</html>
