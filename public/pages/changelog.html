<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentClash</title>
  <link rel="stylesheet" href="/assets/shared.css?v=1">
  <script src="/assets/i18n.js?v=1"></script>
  <script src="/assets/api.js?v=1"></script>
  <script src="/assets/nav.js?v=2"></script>
  <style>
    .log-head { max-width: 820px; margin: 0 auto; padding: 28px 20px 4px; }
    .log-head h1 { font-size: 26px; color: var(--text); margin: 0 0 10px; }
    .log-head .tagline { color: var(--text-dim); font-size: 15px; margin: 0; line-height: 1.7; }

    .log-wrap { max-width: 820px; margin: 0 auto; padding: 20px 20px 56px; }

    /* Vertical timeline: a rail down the left, each release a node on it */
    .timeline { position: relative; margin: 0; padding: 0 0 0 28px; list-style: none; }
    .timeline::before {
      content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px;
      width: 2px; background: var(--border);
    }
    .release { position: relative; margin: 0 0 26px; }
    .release:last-child { margin-bottom: 0; }
    .release::before {
      content: ""; position: absolute; left: -28px; top: 5px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg); border: 2px solid var(--gold);
      box-shadow: 0 0 0 4px var(--bg);
    }

    .release-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
    }
    .release-top {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .release-date {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12.5px; color: var(--text-dim); letter-spacing: .02em;
    }
    .release h2 { font-size: 17px; color: var(--gold); margin: 6px 0 12px; }

    .tag {
      font-size: 11px; line-height: 1; padding: 4px 8px; border-radius: 999px;
      border: 1px solid transparent; font-weight: 600; white-space: nowrap;
    }
    .tag-feature    { color: var(--green-light); border-color: var(--green-dark); background: rgba(106,191,106,.08); }
    .tag-balance    { color: var(--blue-light);  border-color: var(--blue);       background: rgba(106,159,213,.08); }
    .tag-experience { color: var(--gold);        border-color: #8a6d00;            background: rgba(255,215,0,.07); }
    .tag-core       { color: var(--red-light);   border-color: var(--red);         background: rgba(213,106,106,.08); }

    ul.changes { margin: 0; padding: 0; list-style: none; }
    ul.changes li {
      position: relative; padding: 7px 0 7px 20px; color: var(--text-dim);
      font-size: 14px; line-height: 1.75;
    }
    ul.changes li::before {
      content: "▸"; position: absolute; left: 0; top: 7px; color: var(--gold);
    }

    .log-empty { color: var(--text-dim); font-size: 14px; text-align: center; padding: 40px 0; }

    @media (max-width: 600px) {
      .release h2 { font-size: 16px; }
      .release-card { padding: 15px 16px; }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <main>
    <div class="log-head">
      <h1 data-i18n="changelog.title">更新日志</h1>
      <p class="tagline" data-i18n="changelog.tagline">玩法与机制的更新记录，最新的在最上面。</p>
    </div>

    <div class="log-wrap">
      <ul class="timeline" id="timeline"></ul>
      <p class="log-empty" id="log-empty" style="display:none" data-i18n="changelog.empty">暂时还没有更新记录。</p>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script>
    (function () {
      const TAG_CLASS = {
        feature: "tag-feature",
        balance: "tag-balance",
        experience: "tag-experience",
        core: "tag-core",
      };

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function renderEntries(entries, lang) {
        const tl = document.getElementById("timeline");
        const empty = document.getElementById("log-empty");
        const list = Array.isArray(entries) ? entries : [];
        if (!list.length) {
          tl.innerHTML = "";
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";
        tl.innerHTML = list.map((e) => {
          const loc = e[lang] || e.en || e.zh || { title: "", items: [] };
          const tags = (e.tags || []).map((tg) => {
            const cls = TAG_CLASS[tg] || "tag-core";
            return `<span class="tag ${cls}">${esc(t("changelog.tag." + tg) || tg)}</span>`;
          }).join("");
          const items = (loc.items || []).map((it) => `<li>${esc(it)}</li>`).join("");
          return `
            <li class="release">
              <div class="release-card">
                <div class="release-top">
                  <span class="release-date">${esc(e.date || "")}</span>
                  ${tags}
                </div>
                <h2>${esc(loc.title || "")}</h2>
                <ul class="changes">${items}</ul>
              </div>
            </li>`;
        }).join("");
      }

      window.i18nReady && window.i18nReady.then(async () => {
        const lang = window.i18n.lang;
        try {
          const res = await fetch("/changelog.json", { cache: "no-cache" });
          const data = await res.json();
          renderEntries(data.entries, lang);
        } catch {
          renderEntries([], lang);
        }
      });
    })();
  </script>
</body>
</html>
