<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentClash</title>
  <link rel="stylesheet" href="/assets/shared.css?v=1">
  <script src="/assets/i18n.js?v=1"></script>
  <script src="/assets/api.js?v=1"></script>
  <script src="/assets/nav.js?v=2"></script>
  <style>
    .me-layout { max-width: 820px; margin: 0 auto; padding: 24px 20px; }

    .me-profile { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding: 20px 24px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
    .me-profile .avatar { width: 48px; height: 48px; border-radius: 50%; }
    .me-profile .name { font-size: 18px; font-weight: 600; color: var(--text); }
    .me-profile .gh { font-size: 14px; color: var(--text-dim); }

    .me-signed-out { text-align: center; padding: 60px 20px; }
    .me-signed-out h2 { color: var(--gold); margin-bottom: 8px; }
    .me-signed-out p { color: var(--text-dim); margin-bottom: 20px; }
    .me-signed-out a { display: inline-block; padding: 10px 24px; background: var(--gold); color: var(--bg); border-radius: 8px; text-decoration: none; font-weight: 600; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-header h2 { font-size: 20px; color: var(--text); margin: 0; }

    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--gold); color: var(--bg); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: #c32; color: #fff; }
    .btn-sm { font-size: 12px; padding: 4px 10px; }

    .cmd-card { display: flex; align-items: center; gap: 16px; padding: 16px 20px; margin-bottom: 10px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
    .cmd-card .info { flex: 1; min-width: 0; }
    .cmd-card .cmd-name { font-size: 16px; font-weight: 600; color: var(--text); }
    .cmd-card .meta { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .cmd-card .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .tier-badge { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .tier-Master { background: #c8a; color: #fff; }
    .tier-Diamond { background: #a8f; color: #fff; }
    .tier-Platinum { background: #68c; color: #fff; }
    .tier-Gold { background: #db0; color: #222; }
    .tier-Silver { background: #889; color: #fff; }
    .tier-Bronze { background: #864; color: #fff; }

    .onboarding-card { margin-top: 20px; padding: 20px 24px; background: #1a3a1a; border: 1px solid #2a5a2a; border-radius: 12px; }
    .onboarding-card h3 { margin: 0 0 4px; color: #5f5; font-size: 16px; }
    .onboarding-card .hint { font-size: 13px; color: #afa; margin-bottom: 12px; }
    .onboarding-card .code-box { display: flex; align-items: center; gap: 8px; background: #111; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
    .onboarding-card .code-box code { flex: 1; font-size: 12px; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: break-all; }
    .onboarding-card .warn { font-size: 12px; color: #f96; margin-top: 8px; }
    .onboarding-card .actions-row { display: flex; gap: 8px; margin-top: 12px; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; }
    .modal h3 { margin: 0 0 16px; color: var(--text); }
    .modal label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
    .modal input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; box-sizing: border-box; }
    .modal .err { font-size: 12px; color: #f66; margin-top: 6px; min-height: 18px; }
    .modal .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

    .loading-placeholder { text-align: center; color: var(--text-dim); padding: 40px 0; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; top: 20px; right: 20px; padding: 10px 16px; background: #2a5a2a; color: #afa; border-radius: 8px; z-index: 2000; font-size: 14px; opacity: 0; transform: translateY(-10px); transition: all 0.25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    .manage-panel { background: var(--surface); border: 1px solid var(--gold); border-radius: 12px; overflow: hidden; }
    .manage-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .manage-header h3 { margin: 0; font-size: 16px; color: var(--gold); }
    .manage-sections { padding: 16px 20px; }
    .manage-section { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .manage-section:last-child { border-bottom: none; }
    .manage-label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .manage-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .code-box { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
    .code-box code { flex: 1; font-size: 12px; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .code-box code.blurred { color: var(--text-dim); user-select: none; }
    .danger-section { padding: 16px 0; }
    .danger-section .manage-label { color: #f66; }

    /* Management panel shown as a centered modal (so the agent URL is never missed) */
    .manage-modal-box { width: 92%; max-width: 560px; max-height: 86vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <main class="me-layout">
    <div id="signed-out" style="display:none">
      <div class="me-signed-out">
        <h2 id="me-signed-out-title">…</h2>
        <p id="me-signed-out-desc">…</p>
        <a href="/auth/github"><span id="me-signed-out-btn">…</span></a>
      </div>
    </div>

    <div id="signed-in" style="display:none">
      <div class="me-profile">
        <img class="avatar" id="me-avatar" src="" alt="">
        <div>
          <div class="name" id="me-display-name">…</div>
          <div class="gh" id="me-github">…</div>
        </div>
      </div>

      <div class="section-header">
        <h2 id="me-commanders-title">…</h2>
        <button class="btn btn-primary" id="btn-create">…</button>
      </div>

      <div id="cmd-list"></div>
      <div id="cmd-loading" class="loading-placeholder"><span class="spinner"></span></div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">…</h3>
      <label id="modal-label">…</label>
      <input type="text" id="modal-input" maxlength="32" placeholder="">
      <div class="err" id="modal-err"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">…</button>
        <button class="btn btn-primary" id="modal-submit">…</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="manage-modal">
    <div class="manage-modal-box" id="manage-modal-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/assets/me.js?v=2"></script>
</body>
</html>
