<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentClash</title>
  <link rel="stylesheet" href="/assets/shared.css?v=1">
  <script src="/assets/i18n.js?v=1"></script>
  <script src="/assets/api.js?v=1"></script>
  <script src="/assets/nav.js?v=2"></script>
  <script src="/assets/sprites.js?v=3"></script>
  <style>
    .army-wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px; }
    .army-head { margin-bottom: 20px; }
    .army-head h1 { font-size: 22px; color: var(--text); margin: 0 0 4px; }
    .army-head .subtitle { color: var(--text-dim); font-size: 13px; margin: 0; }

    .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .unit-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .unit-card-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .unit-icon {
      width: 60px; height: 60px; border-radius: 8px; flex: 0 0 auto;
      background-color: #0f1830; border: 1px solid var(--border);
      background-repeat: no-repeat; background-position: center bottom;
      background-size: 52px 52px;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    .unit-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .unit-type-tag { font-size: 11px; color: var(--text-dim); }

    .unit-card-body { padding: 14px 18px; }
    .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .stat-label { color: var(--text-dim); }
    .stat-value { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-value.hp { color: #6f6; }
    .stat-value.atk { color: #f66; }
    .stat-value.range { color: #6cf; }
    .stat-value.move { color: #fc6; }
    .stat-value.initiative { color: #c9f; }
    .stat-value.cost { color: var(--gold); }

    .special-box { margin-top: 10px; padding: 8px 12px; background: rgba(200,160,60,0.1); border: 1px solid rgba(200,160,60,0.3); border-radius: 6px; font-size: 12px; color: #db0; }
    .special-box.none { background: var(--bg); border-color: var(--border); color: var(--text-dim); }

    .legend { margin-top: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .legend h2 { font-size: 15px; color: var(--text); margin: 0 0 12px; }
    .legend dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
    .legend dt { color: var(--gold); font-weight: 700; }
    .legend dd { color: var(--text-dim); margin: 0; }

    @media (max-width: 640px) {
      .unit-grid { grid-template-columns: 1fr; }
      .legend dl { grid-template-columns: 1fr; gap: 2px 0; }
      .legend dd { margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <div id="nav-mount"></div>

  <main class="army-wrap">
    <div class="army-head">
      <h1 data-i18n="army.title">兵种</h1>
      <p class="subtitle" data-i18n="army.subtitle">…</p>
    </div>
    <div class="unit-grid" id="unitGrid"></div>

    <section class="legend">
      <h2 data-i18n="army.legend.title">属性说明</h2>
      <dl>
        <dt data-i18n="army.stat.hp">生命</dt><dd data-i18n="army.legend.hp">…</dd>
        <dt data-i18n="army.stat.atk">攻击</dt><dd data-i18n="army.legend.atk">…</dd>
        <dt data-i18n="army.stat.range">射程</dt><dd data-i18n="army.legend.range">…</dd>
        <dt data-i18n="army.stat.move">移动</dt><dd data-i18n="army.legend.move">…</dd>
        <dt data-i18n="army.stat.initiative">先攻</dt><dd data-i18n="army.legend.initiative">…</dd>
        <dt data-i18n="army.stat.cost">金钱价</dt><dd data-i18n="army.legend.cost">…</dd>
      </dl>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script>
    (async function () {
      await window.i18nReady;

      const units = [
        {
          type: "knight",
          icon: "🛡️",
          stats: { hp: 100, atk: 20, range: 1, move: 2, initiative: 3, cost: 5 },
          special: "army.special.knight",
        },
        {
          type: "spear",
          icon: "🗡️",
          stats: { hp: 60, atk: 25, range: 2, move: 3, initiative: 5, cost: 3 },
          special: "army.special.spear",
        },
        {
          type: "archer",
          icon: "🏹",
          stats: { hp: 40, atk: 18, range: 4, move: 2, initiative: 6, cost: 3 },
          special: null,
        },
        {
          type: "mage",
          icon: "🧙",
          stats: { hp: 35, atk: 30, range: 3, move: 1, initiative: 4, cost: 4 },
          special: "army.special.mage",
        },
        {
          type: "priest",
          icon: "✨",
          stats: { hp: 50, atk: 10, range: 2, move: 1, initiative: 4, cost: 4 },
          special: "army.special.priest",
        },
        {
          type: "engineer",
          icon: "🔧",
          stats: { hp: 40, atk: 12, range: 1, move: 2, initiative: 4, cost: 2 },
          special: "army.special.engineer",
          noPassive: true,
        },
      ];

      function renderCard(u) {
        let extra = "";
        if (u.special) {
          extra += `<div class="special-box${u.noPassive ? " none" : ""}">${t(u.special)}</div>`;
        }
        return `
          <div class="unit-card">
            <div class="unit-card-header">
              <div class="unit-icon ${u.type}" style="background-image:url('${window.unitSpriteURL(u.type, "A")}')"></div>
              <div>
                <div class="unit-name">${t("unit." + u.type)}</div>
                <div class="unit-type-tag">${u.type}</div>
              </div>
            </div>
            <div class="unit-card-body">
              <div class="stat-row"><span class="stat-label">${t("army.stat.hp")}</span><span class="stat-value hp">${u.stats.hp}</span></div>
              <div class="stat-row"><span class="stat-label">${t("army.stat.atk")}</span><span class="stat-value atk">${u.stats.atk}</span></div>
              <div class="stat-row"><span class="stat-label">${t("army.stat.range")}</span><span class="stat-value range">${u.stats.range}</span></div>
              <div class="stat-row"><span class="stat-label">${t("army.stat.move")}</span><span class="stat-value move">${u.stats.move}</span></div>
              <div class="stat-row"><span class="stat-label">${t("army.stat.initiative")}</span><span class="stat-value initiative">${u.stats.initiative}</span></div>
              <div class="stat-row"><span class="stat-label">${t("army.stat.cost")}</span><span class="stat-value cost">${u.stats.cost}</span></div>
              ${extra}
            </div>
          </div>`;
      }

      document.getElementById("unitGrid").innerHTML = units.map(renderCard).join("");
    })();
  </script>
</body>
</html>
